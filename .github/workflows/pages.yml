name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'FEED.md'
      - 'llms.txt'
      - 'product-news.md'
      - 'data/products.json'
      - 'README.md'
      - 'api-changelog.md'
      - 'NEWS.md'
      - 'website-news.md'
      - 'releases.md'
      - 'npm.md'
      - 'huggingface.md'
      - 'insights.md'
      - 'SIGNALS.md'
      - 'scripts/build-pages.mjs'
      - 'site/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  # Pull requests get the build, the tests and the contrast check, but never a
  # deploy. Without this the gates only ran after merge, so a broken site build
  # landed on main and failed Pages there instead of failing the PR.
  pull_request:
    paths:
      - 'FEED.md'
      - 'llms.txt'
      - 'product-news.md'
      - 'data/products.json'
      - 'README.md'
      - 'api-changelog.md'
      - 'NEWS.md'
      - 'website-news.md'
      - 'releases.md'
      - 'npm.md'
      - 'huggingface.md'
      - 'insights.md'
      - 'SIGNALS.md'
      - 'scripts/build-pages.mjs'
      - 'scripts/contrast.mjs'
      - 'site/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site is an Astro project under site/. build-pages.mjs stages the
      # tracker's markdown into site/public/ and then runs the build, so this
      # step is the whole pipeline.
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # These read the real committed data, so they fail when the parser drifts
      # from what track.mjs writes — which is how the CRLF bug that made every
      # source file parse as empty was caught in the first place.
      - name: Test data model
        run: |
          node site/src/lib/transit.test.mjs
          node scripts/corners.x.test.mjs
          node scripts/signals.test.mjs
          node --test scripts/readme-latest.test.mjs scripts/automation.test.mjs scripts/review-pr.test.mjs scripts/products.test.mjs

      - name: Build site
        run: node scripts/build-pages.mjs

      - name: Check contrast
        run: node scripts/contrast.mjs

      # Pages plumbing only makes sense on a branch that actually deploys.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Astro writes to site/dist; the markdown staged into public/ is
          # copied there, so the documented raw-markdown URLs keep resolving.
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
