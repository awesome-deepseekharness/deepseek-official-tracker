name: Discover with Opencode (experimental)

on:
  schedule:
    - cron: '30 3 * * *' # daily 03:30 UTC (between track 6h runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover.mjs'
      - '.github/workflows/discover.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: |
          set -e
          # Try npm first (fast), fallback to install script
          if npm install -g opencode-ai 2>&1 | head -n 20; then
            echo "opencode via npm done"
          else
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          opencode --version || echo "opencode not found, fallback will be used"
          # Verify free models endpoint reachable
          curl -s https://opencode.ai/zen/v1/models | head -c 500 || true

      - name: Run discover (free model traversal)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          echo "OPENCODE_API_KEY present: $([ -n \"$OPENCODE_API_KEY\" ] && echo yes || echo no)"
          node scripts/discover.mjs
          echo "---insights preview---"
          head -n 100 insights.md || true
          echo "---.discover-prompt preview---"
          head -n 30 .discover-prompt.md 2>/dev/null || true

      - name: Create PR if insights changed (safe default)
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(discover): AI draft insights for review"
          branch: discover/insights-${{ github.run_id }}
          delete-branch: true
          title: "chore(discover): AI draft — ${{ github.run_number }}"
          body: |
            **Experimental Opencode discovery — needs human review before merge**

            - Prompt: `.discover-prompt.md` (not committed, see Action logs)
            - Source diff: vs `data/state.json` websiteNews
            - **Do not auto-merge**: verify every `[Source]` link and date, check for hallucinations.
            - To enable AI summarization, set `OPENCODE_API_KEY` (https://opencode.ai/auth) in repo Secrets. Without it, fallback deterministic template is used.

            This PR was auto-created on `03:30 UTC` schedule. Close if no new official updates.
          add-paths: |
            insights.md
          labels: |
            ai-draft
            needs-review

      - name: Handle PR permission fallback
        if: steps.cpr.outcome == 'failure'
        run: |
          echo "::warning::PR creation blocked — org setting 'Allow GitHub Actions to create and approve pull requests' is OFF."
          echo "Enable at: https://github.com/organizations/awesome-deepseekharness/settings/actions"
          echo "Branch discover/insights-${{ github.run_id }} was pushed but PR not created. You can manually create PR via gh:"
          echo "  gh pr create --head discover/insights-${{ github.run_id }} --base main --title 'chore(discover): AI draft'"
          # Keep branch for manual PR, don't delete
          git ls-remote --heads origin discover/insights-${{ github.run_id }} | head -n 5

      - name: Summary
        if: always()
        run: |
          echo "Discover run done. Check PR tab for ai-draft if insights changed."
          ls -lh insights.md .discover-prompt.md 2>&1 | head -n 20
