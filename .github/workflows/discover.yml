name: Discover with Opencode (experimental)

on:
  schedule:
    - cron: '30 3 * * *' # daily 03:30 UTC (between track 6h runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover.mjs'
      - 'scripts/opencode-runner.mjs'
      - 'scripts/corners.mjs'
      - 'scripts/search-mcp.mjs'
      - 'scripts/products.mjs'
      - 'opencode.json'
      - '.opencode/agent/discover.md'
      - '.github/workflows/discover.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pinned OpenCode and validate configuration
        run: |
          npm install -g opencode-ai@1.18.34
          opencode debug config > /dev/null
          opencode mcp list

      - name: Run discover (free model traversal)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCOVER_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -e
          node scripts/discover.mjs
          echo "---insights preview---"
          head -n 100 insights.md || true
          echo "---.discover-prompt preview---"
          head -n 30 .discover-prompt.md 2>/dev/null || true

      - name: Create PR if insights changed (safe default)
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(discover): AI draft insights for review"
          branch: discover/insights
          delete-branch: true
          title: "chore(discover): AI draft — ${{ github.run_number }}"
          body: |
            **Discovery report — independently reviewed by the automated source reviewer**

            - Prompt: `.discover-prompt.md` (not committed, see Action logs)
            - Source diff: multi-corner live signals from `scripts/corners.mjs` vs `data/discover-seen.json`
            - Auto-review verifies source content, attribution, dates and the site build before merging the exact reviewed head.
            - Uses current free OpenCode models with retries. Model failures preserve the previous report and fail the run for retry; they do not create placeholder drafts.

            This PR was auto-created on `03:30 UTC` schedule. Useful community, media and clearly labelled rumours are eligible even without new official model news.
          add-paths: |
            insights.md
          labels: |
            ai-draft
            needs-review

      # Advance the independent baseline only after the draft PR was created
      # successfully. A failed PR creation must not consume unreported leads.
      - name: Commit & push seen baseline (operational state, not PR-gated)
        run: |
          set -e
          if [ ! -f data/discover-seen.json ]; then
            echo "No data/discover-seen.json produced (run was gated or skipped) — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discover-seen.json
          if git diff --cached --quiet; then
            echo "Seen baseline unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(discover): update seen baseline ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            echo "Push attempt $i/3..."
            git pull --rebase --autostash || true
            if git push; then
              echo "Seen baseline pushed (attempt $i)"
              exit 0
            fi
            echo "Push failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "::error::Failed to push seen baseline"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "Discover run done. Check PR tab for ai-draft if insights changed."
          ls -lh insights.md .discover-prompt.md 2>&1 | head -n 20
