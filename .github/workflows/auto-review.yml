name: Auto Review discover PRs (AI)

on:
  workflow_run:
    workflows: ["Discover with Opencode (experimental)"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional discovery PR number'
        required: false
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       startsWith(github.event.pull_request.head.ref, 'discover/insights'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Always load executable code and agent instructions from main.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned OpenCode and site dependencies
        run: |
          npm install -g opencode-ai@1.18.34
          npm ci --prefix site
          opencode debug config > /dev/null
      - name: Review sources, validate candidate and act on the exact reviewed head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/review-pr.mjs
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence
          path: |
            .review-decision.json
            .review-input/pr.json
          include-hidden-files: true
          if-no-files-found: ignore
