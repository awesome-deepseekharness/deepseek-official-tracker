name: Track DeepSeek Official Updates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tracker
        run: node scripts/track.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git commit -m "chore: auto-update official feed ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Robust push with rebase & retry (fixes occasional 09:15-style rejected errors)
          for i in 1 2 3; do
            echo "Push attempt $i/3..."
            git pull --rebase --autostash || true
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "All push attempts failed"
          exit 1
